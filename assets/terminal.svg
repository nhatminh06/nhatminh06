<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Minh Pham — Terminal Profile</title>
  <desc id="desc">An animated Linux terminal showing Minh Pham's identity, interests in systems and ML infrastructure, and selected GitHub projects.</desc>
  <defs>
    <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#080f19"/></linearGradient>
    <linearGradient id="aside" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0f1b2c"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#163043" stroke-width=".55" opacity=".44"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".4"/></filter>
    <clipPath id="outer"><rect x="18" y="16" width="1084" height="546" rx="15"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .cmd{font-size:19px;font-weight:600;fill:#9af7af}
    .out{font-size:17px;fill:#b9c8d8}
    .muted{fill:#7890a6}
    .cyan{fill:#6bd9e7}
    .white{fill:#eaf4ff}
    .purple{fill:#b1a0fa}
    .appear1{animation:fade 0.5s ease 0.4s both}
    .appear2{animation:fade 0.5s ease 1.15s both}
    .appear3{animation:fade 0.5s ease 1.75s both}
    .appear4{animation:fade 0.5s ease 2.4s both}
    .appear5{animation:fade 0.5s ease 3.05s both}
    .appear6{animation:fade 0.5s ease 3.7s both}
    .appear7{animation:fade 0.5s ease 4.3s both}
    .appear8{animation:fade 0.5s ease 4.95s both}
    .appear9{animation:fade 0.5s ease 5.6s both}
    .appear10{animation:fade 0.5s ease 6.25s both}
    .cmdtype1{animation:type 0.9s steps(25,end) .35s both}
    .cmdtype2{animation:type 0.55s steps(9,end) 1.73s both}
    .cmdtype3{animation:type 0.85s steps(24,end) 3.0s both}
    .cmdtype4{animation:type 0.85s steps(28,end) 4.3s both}
    .cursor{animation:blink 1s steps(1) infinite}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    .meterA{animation:meterA 3.3s ease-in-out infinite}
    .meterB{animation:meterB 2.6s ease-in-out infinite}
    .meterC{animation:meterA 4.2s ease-in-out infinite reverse}
    @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes meterA{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes meterB{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){.appear1,.appear2,.appear3,.appear4,.appear5,.appear6,.appear7,.appear8,.appear9,.appear10,.cmdtype1,.cmdtype2,.cmdtype3,.cmdtype4,.cursor,.pulse,.meterA,.meterB,.meterC{animation:none}}
  </style>

  <!-- terminal body / chrome -->
  <rect width="1120" height="580" fill="#060b12"/>
  <rect x="18" y="16" width="1084" height="546" rx="15" fill="url(#shell)" stroke="#2a3c4e" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#outer)">
    <rect x="18" y="16" width="1084" height="50" fill="#151e2c"/>
    <path d="M18 66H1102" stroke="#27394c" stroke-width="1.5"/>
    <circle cx="47" cy="42" r="7" fill="#f27d7d"/>
    <circle cx="71" cy="42" r="7" fill="#f5c96a"/>
    <circle cx="95" cy="42" r="7" fill="#79d8a8"/>
    <text x="125" y="48" class="mono" fill="#c3cede" font-size="16" font-weight="600">minh@github:~/profile</text>
    <text x="1066" y="47" class="mono" fill="#7b95a8" font-size="14" text-anchor="end">zsh — 112 × 35</text>

    <!-- left-hand diagnostics panel -->
    <rect x="19" y="67" width="291" height="493" fill="url(#aside)"/>
    <rect x="19" y="67" width="291" height="493" fill="url(#grid)" opacity=".65"/>
    <path d="M310 67V561" stroke="#24384b" stroke-width="1.5"/>
    <text x="47" y="111" class="mono cyan" font-size="14" letter-spacing="2">[ SYSTEM PROFILE ]</text>
    <text x="44" y="186" class="mono white" font-size="61" font-weight="800" letter-spacing="-4">MINH</text>
    <text x="45" y="242" class="mono cyan" font-size="61" font-weight="800" letter-spacing="-4">PHAM</text>
    <path d="M45 259H276" stroke="#2d485d" stroke-width="1.5"/>
    <text x="47" y="296" class="mono" fill="#829ab0" font-size="15">USER</text>
    <text x="273" y="296" class="mono white" text-anchor="end" font-size="15">nhatminh06</text>
    <text x="47" y="326" class="mono" fill="#829ab0" font-size="15">LOCATION</text>
    <text x="273" y="326" class="mono white" text-anchor="end" font-size="15">Minnesota, USA</text>
    <text x="47" y="356" class="mono" fill="#829ab0" font-size="15">STATUS</text>
    <circle cx="194" cy="350" r="5" fill="#86f9aa" class="pulse"/>
    <text x="273" y="356" class="mono" fill="#86f9aa" text-anchor="end" font-size="15">building</text>
    <path d="M45 379H276" stroke="#2d485d" stroke-width="1.5"/>
    <text x="47" y="409" class="mono" fill="#96aac0" font-size="14">$ systemctl status</text>
    <circle cx="52" cy="436" r="3" fill="#81e4a1"/><text x="65" y="440" class="mono" fill="#81e4a1" font-size="13">linux</text>
    <circle cx="52" cy="460" r="3" fill="#81e4a1"/><text x="65" y="464" class="mono" fill="#81e4a1" font-size="13">distributed-systems</text>
    <circle cx="52" cy="484" r="3" fill="#81e4a1"/><text x="65" y="488" class="mono" fill="#81e4a1" font-size="13">ml-infrastructure</text>
    <path d="M47 527H105" stroke="#63d2e5" stroke-width="4" stroke-linecap="round" class="meterA"/>
    <path d="M114 527H172" stroke="#95f0ab" stroke-width="4" stroke-linecap="round" class="meterB"/>
    <path d="M181 527H240" stroke="#b9a4f4" stroke-width="4" stroke-linecap="round" class="meterC"/>

    <!-- command area -->
    <text x="347" y="105" class="mono muted" font-size="14" letter-spacing="1">SESSION / INTRODUCTION</text>
    <path d="M347 119H1068" stroke="#1f3444"/>
    <g class="appear1">
      <text x="348" y="158" class="mono cmd cmdtype1">$ ./profile.sh --boot</text>
    </g>
    <g class="appear2">
      <text x="348" y="193" class="mono out"><tspan fill="#83e2aa">[  OK  ]</tspan><tspan dx="10">Identity loaded. Welcome to my workspace.</tspan></text>
    </g>
    <g class="appear3">
      <text x="348" y="233" class="mono cmd cmdtype2">$ whoami</text>
    </g>
    <g class="appear4">
      <text x="348" y="271" class="mono white" font-size="27" font-weight="700">Minh Pham</text>
      <text x="348" y="300" class="mono out">CS + Mathematics  <tspan fill="#6bd9e7">@ University of Minnesota</tspan></text>
    </g>
    <g class="appear5">
      <text x="348" y="347" class="mono cmd cmdtype3">$ cat /etc/focus</text>
    </g>
    <g class="appear6">
      <text x="348" y="382" class="mono out">distributed systems <tspan fill="#738da3">/</tspan> Linux <tspan fill="#738da3">/</tspan> networking</text>
      <text x="348" y="407" class="mono out">ML systems <tspan fill="#738da3">/</tspan> GPU performance <tspan fill="#738da3">/</tspan> cloud infra</text>
    </g>
    <g class="appear7">
      <text x="348" y="453" class="mono cmd cmdtype4">$ ls ~/projects | head -n 6</text>
    </g>
    <g class="appear8">
      <text x="348" y="488" class="mono cyan" font-size="17">quorumkv/</text>
      <text x="510" y="488" class="mono purple" font-size="17">tensorforge/</text>
      <text x="695" y="488" class="mono cyan" font-size="17">wirestack/</text>
    </g>
    <g class="appear9">
      <text x="348" y="514" class="mono cyan" font-size="17">aegis/</text>
      <text x="510" y="514" class="mono purple" font-size="17">commercecore/</text>
      <text x="713" y="514" class="mono cyan" font-size="17">linux-kernel-lab/</text>
    </g>
    <g class="appear10">
      <text x="348" y="546" class="mono" fill="#9af7af" font-size="17">minh@github:~$</text>
      <rect x="502" y="532" width="11" height="17" rx="1" fill="#a6f5b5" class="cursor"/>
    </g>
  </g>
</svg>
